<!-- VIEW 10: RAW MATERIAL PURCHASES -->
<section id="view-purchases" class="view-section">
  <div class="page-header">
    <div class="page-title-area">
      <h2><span>🛒</span> Raw Material Purchases</h2>
      <p>Track supplier invoices, quantities, rates, transport costs, and payment status.</p>
    </div>
    <button class="btn btn-primary admin-only" data-open-modal="modalRecordPurchase">+ New Purchase</button>
  </div>

  <div class="table-card">
    <div class="table-responsive">
      <table class="data-table" id="tablePurchases">
        <thead>
          <tr>
            <th>Purchase ID</th>
            <th>Date</th>
            <th>Supplier</th>
            <th>Material</th>
            <th>Quantity</th>
            <th>Rate</th>
            <th>Material Cost</th>
            <th>Transport</th>
            <th>Total Cost</th>
            <th>Status</th>
            <th>Invoice</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</section>
